[project]
name = "bharatcrop-foundation-api"
version = "0.1.0"
description = "Provider-independent FastAPI foundation scaffold"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.120,<1.0",
    "joblib>=1.4,<2.0",
    "pandas>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pyarrow>=19,<20",
    "scikit-learn==1.8.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.38,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.15,<2.0",
    "pandas-stubs>=2.2,<3.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
files = ["bharatcrop_foundation", "tests"]
